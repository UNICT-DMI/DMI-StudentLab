name: Sincronizza avvisi DMI

on:
  schedule:
    # Ogni ora al minuto 17 (UTC; ogni ora anche nell'ora italiana).
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-dmi-notices
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'FranzAmoroso/DMI-StudentLab'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installa le dipendenze dello scraper
        run: python -m pip install --disable-pip-version-check --no-input 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Sincronizza gli avvisi ufficiali
        env:
          STUDENTLAB_NOTICE_API_URL: https://dmi-student-lab.vercel.app/institutional-notices/sync
          STUDENTLAB_NOTICE_SYNC_TOKEN: ${{ secrets.STUDENTLAB_NOTICE_SYNC_TOKEN }}
        run: |
          if [ -z "$STUDENTLAB_NOTICE_SYNC_TOKEN" ]; then
            echo 'Configura STUDENTLAB_NOTICE_SYNC_TOKEN nei Secrets del repository.' >&2
            exit 1
          fi
          python BE/scripts/sync_dmi_notices.py
